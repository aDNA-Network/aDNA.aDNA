  # ── O ──────────────────────────────────────────────────────────────────────────────────────
  - id: O1
    coverage:
      adna_site:
        status: gap
        sequenced: >-
          ⛩ ADJUDICATED AT P4.3 O1 (AC6), 2026-08-24 — NOT MET, and it stays `gap` on purpose.
          The INSTRUMENT landed at P4.2 O3. This field previously read "P4.4 (the fixes)", which
          the ⛩ P4.4 gate had already superseded by deferring the legibility judgement to P4.3 by
          name — a routing field naming a mission that had closed, which is the index-vs-artifact
          class one level down. Re-measured independently at P4.3 O1 across 3 routes × 5 widths ×
          2 themes: per-figure worst cases MATCH P4.2's exactly (3.5 / 8.0 / 8.5 px), and the
          corpus-wide aggregate — derived for the first time — is 398 of 510 painted text nodes
          below the floor. The deferral chain STOPS here: this is open debt with a characterised
          remedy (per-figure mobile treatment), not a fourth hand-off.
          Record: how/campaigns/campaign_haussmann/artifacts/p4_3/ac6_typeset_floor_adjudication.md
        detail: >-
          ⛔ STILL A GAP, DELIBERATELY, AND THE REASON IS THIS LOCK'S OWN RULE TEXT. `gate-39` now
          measures exactly what the lock names — every `text, tspan` in a committed figure, rendered
          size via `sqrt(|det(CTM)|)` and never `getComputedStyle`, at 320/390/1024/1440/1920 in both
          appearances, plus overlap, clipping and the ±30° running-text clause. It found the floor is
          NOT met: `hero-graph-svg` 27/27 labels below 12px at EVERY width (3.5px at 320, never better
          than 7.1px at 1920) · `netdiagram-svg` 7/8 at 320 and 7/8 at desktop on /network/ ·
          `convergence-funnel` 8/8 at 320. The gate therefore ships with a DATED BASELINE (gate-25's
          allowlist idiom): each figure pinned at its current worst case, hard-failing any unlisted
          figure and any regression, ratcheting as each one is fixed. Red-proven both ways —
          `craft_floor_redtest.sh` cases 7 and 8.
          ⚠ A NON-REGRESSION FENCE IS NOT THE RULE, so this cell is not `enforced`. Marking it so
          would be precisely the fake-enforcement this lock's own text warns about — "a gate that
          enumerates a SUBSET of its rule's domain is a fake enforcement even when its code is real" —
          and this lock read `enforced` upstream for a whole round in exactly that state.
          The remedy is design work, not a font-size bump: these are SVGs authored in a viewBox and
          scaled (0.28× for the hero graph at 320px), so clearing the floor needs a portrait twin, a
          min-width with scroll, or a redraw — and the homepage hero graph is a campaign-protected
          surface. Rules a contributor can follow are published at /design-system#diagram, and that
          page states plainly that the floor is currently unmet rather than letting a reader assume.

  - id: O2
    coverage:
