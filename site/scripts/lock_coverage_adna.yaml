        note: >-
          ⚠ THE PREDICATE IS DELIBERATELY NARROWER THAN THE OBVIOUS ONE, AND THE OBVIOUS ONE WAS
          TESTED AND REJECTED. A plain `client:(load|visible|…)` grep FIRES on this site — on
