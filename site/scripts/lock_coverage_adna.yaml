          census." It does exist. `src/pages/vaults/index.astro:226` carries
          `<p class="vaults-result-count" role="status" aria-live="polite">`, landed 2026-07-11 in
          `5b9be4c` — six weeks before the census that reported it absent — and it is WIRED, not
          decorative: `countEl.textContent` is assigned in `apply()` (index.astro:328-332), which runs
          on the search input event and on both chip groups' click handlers. O0's grep was narrower
          than its conclusion; a negative result is only as wide as the command that produced it
          (campaign convention 16's amendment, recurring inside the mission that cites it).
          WHAT IS ACTUALLY MISSING is an ASSERTION, not a mechanism: nothing anywhere tests that the
          live region stays wired, so a refactor dropping `countEl` breaks the announcement with no
          gate going red. Still `gap` for that reason, and still P4.3 — the a11y-manual mission is
          where a live-region assertion belongs, alongside the AT verification that can say whether
          the announcement is USEFUL and not merely present.

  - id: B4
    coverage:
      adna_site:
        status: enforced
        by: site/tests/gates/gate-38-layout-invariants.spec.ts
        anchor: "G38a anchor-offset: scroll-padding clears the sticky header"
        note: >-
          Fixed with A5 at P4.2 O2 — same locus, but a DIFFERENT assertion inside the same test, and
          worth naming because the two are easy to conflate. A5 asks whether an offset exists at all;
          B4 asks whether it equals or exceeds the sum of the sticky chrome. The `toBeGreaterThanOrEqual`
          against the freshly measured `.header` height is B4's limb, and the red test aims a mutation
          at each separately (case 1 deletes the rule → A5; case 2 shrinks `--header-height` to 1rem,
          leaving a real offset that is simply too small → B4). Both red, control green (7/7 overall).
          ⚠ Only ONE piece of sticky chrome exists today, so "the sum" is a sum of one.
          `DocumentationLayout` has two further `position: sticky` elements (the sidebar and the TOC
          rail) but neither sits ABOVE the scroll target, so neither adds to the offset. If a sticky
          sub-header is ever added under the main one, this cell's "sum" becomes load-bearing and the
          gate must measure both.

