          `craft_floor_redtest.sh` case 9, 11/11 overall.
          Sits beside AC5's thin hubs deliberately: both are the heading outline measured from
          opposite ends — one asks whether chrome intrudes into it, the other whether the page has
          one at all.

  # ── J ──────────────────────────────────────────────────────────────────────────────────────
  - id: J1
    coverage:
      adna_site:
        status: enforced
        by: site/tests/gates/gate-38-layout-invariants.spec.ts
        anchor: "G38b heading-primacy: every built page has exactly one h1, before any h2"
        note: >-
          Enforced at P4.2 O2 as a STATIC SCAN OF `dist/` (the gate-14/gate-28 idiom), so it covers
          every built page — 226 at authoring — rather than a chosen sample. Route list derived from
          the build snapshot, never pinned (convention 8).
          ⭐ THE SITE ALREADY CONFORMED 226/226 WHEN THIS LANDED — no page was missing an h1, none had
          two, none emitted an h2 first. That is the honest result and it is not a reason to skip the
          gate: the rule was held by habit, and a rule held by habit is one refactor away from being
          false with nothing to say so. It is also why the red test matters more here than usual — on
          an already-conforming site a no-op assertion and a real one are indistinguishable until one
          of them is made to fail. Two mutations aimed at this cell (a planted second `<h1>`; an
          `<h2>` moved above the `<h1>`), both red, control green (7/7 overall).
          ⚠ Scanning built HTML rather than the DOM means an h1 injected by client-side JS would be
          invisible to this gate. Nothing on this site does that today; if something starts, the cell
          needs a browser limb.

