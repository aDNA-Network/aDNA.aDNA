  - id: B3
    coverage:
      adna_site:
        status: gap
        sequenced: P4.3 (a11y manual)
        detail: >-
          CORRECTED 2026-08-24 (P4.2 O2). The `aria-pressed` limb HOLDS — the `/vaults` filter chips
          carry `aria-pressed` on both toggle groups. STRUCK, FALSE AS WRITTEN AT O0: "the `aria-live`
          limb does NOT exist: `aria-live` appears nowhere in `src/`, so filtering the registry changes
