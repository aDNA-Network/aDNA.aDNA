# lock_coverage_adna.yaml — the craft-floor census for THIS SITE.
#
# HAUSSMANN P4.2 O0 · AC1. Consumer-side declaration against WebForge's 60-lock craft floor.
# Validated by `site/scripts/lock_coverage_check.py`, which consumes WebForge's cell semantics
# BY REFERENCE and repoints only the resolver seam.
#
# READ THIS BEFORE EDITING A CELL
#   `enforced` is a claim that a named file contains code that tests this lock's rule. It is
#   machine-checked: the `by:` path must exist and be a file, and the `anchor:` must resolve in
#   COMMENT-STRIPPED code. An anchor found only in a comment FAILS (rung 3). An anchor found only
#   in a `describe()` container FAILS (rung 1b). Fabricated cells cannot pass.
#
#   `gap` is not a failure of this document — it is the document working. This site has run a
#   371→560-assertion suite for two decades of campaign without ever declaring coverage, which is
#   precisely the KW-12 condition the census exists to expose: nothing catches what nothing claims.
#
#   Where a lock has several limbs and we test some, the cell is `gap` and the disposition NAMES the
#   limb that holds. Declaring `enforced` on a subset is the failure mode lock O1 names in its own
#   rule text — "a gate that enumerates a SUBSET of its rule's domain is a fake enforcement even when
#   its code is real" — and we are not going to commit it in the act of adopting the floor. Cells
#   that ARE enforced but leave a named limb untested carry a `note:`.
#
# The lock count is NOT declared here. `lock_coverage_check.py` derives it from WebForge's live
# matrix on every run and fails if our id set differs. P4.2's AC1 was originally written against
# "57 locks"; the floor is 60. That is the defect the derivation exists to make impossible.

schema: lock_coverage_consumer/v1
upstream: WebForge.aDNA · what/lib/gates/lock_coverage.yaml
upstream_surface_note: >-
  WebForge's own `site` row is THEIR self-site (60/60, 28 enforced / 32 na, `by:` paths inside their
  repo). P0.3 staged the "whose `site` is this row" clarification to Vitruvius and it is still open on
  their side, so this file declares a distinct surface rather than assuming an answer.
census_round: R1
census_status: gating
surfaces:
  - adna_site

locks:
  # ── A ──────────────────────────────────────────────────────────────────────────────────────
  - id: A1
    coverage:
      adna_site:
        status: gap
        sequenced: P4.3 (a11y manual)
        detail: >-
          The HOVER limb holds — `token_aa_check.py` audits `--color-link-hover`/`--color-bg` and the
          primary-hover role at 4.5:1 in BOTH appearances (P4.1 O1, red-proven). The `:active` limb is
          untested and no page-level hover/active contrast test exists. Declared `gap` rather than
          `enforced` because half a rule enforced is the fake-enforcement class lock O1 names.

  - id: A2
    coverage:
      adna_site:
        status: enforced
        by: site/tests/gates/gate-38-layout-invariants.spec.ts
        anchor: "G38c font-delivery: every as=font preload resolves to a bundled woff2, no external host"
        note: >-
          ENFORCED at P4.2 O3 against the lock's ACTUAL rule — "every as=font preload resolves; brand
          fonts bundled woff2" — read from the upstream matrix rather than from the census's summary of
          it. G38c is a static scan of every built page: 3 preloads on each, all `/_astro/*.woff2`, all
          `type="font/woff2"`, all present in `dist/`, and no page reaching an external font host. It
          asserts a preload was found at all, so it cannot pass vacuously. G38d is the companion
          browser limb (no @font-face in the `error` state, 2 routes). Red-proven: case 5 repoints a
          preload at a missing file, case 6 breaks a JetBrains `src` in the built CSS; both red,
          control green (`scripts/craft_floor_redtest.sh`, 6 mutations + 1 control, 7/7).
          ⭐ F20 IS STRUCK — TESTED AND FALSE, which is why the cell says preloads rather than fonts.
          The claim was "`JetBrains Mono Variable` reports `document.fonts` state `error` on every
          page", blamed `[I]` on the non-standard `format('woff2-variations')` keyword, and had stood
          untested since 2026-08-19. Probed across 4 routes × both themes: **errors 0/0 every time**,
          `document.fonts.status: loaded`, `check()` true, no failed font requests, and code renders
          in JetBrains. The observable that reads as the claim is `unloaded: 5` — the CORRECT state
          for five subsets whose `unicode-range` matches no glyph on the page. The control is in the
          same FontFaceSet: Inter and Space Grotesk show the identical unloaded/loaded shape, and if
          `unloaded` meant `error` the whole site would be rendering in system fonts. The duplicate
          latin face is also deliberate, not a bug — `tokens.css` overrides the package's
          `font-display: swap` to `optional` and says so.
          ⚠ The one true limb of the old text survives and is why G38d exists: NOTHING WATCHED FONT
          LOADING, which is precisely how a false claim about it could stand for five days.

  - id: A3
    coverage:
      adna_site:
        status: gap
        sequenced: P4.3 (a11y manual)
        detail: >-
          axe (gate-4) enforces that links HAVE accessible names, in both themes, on every surface —
          it does not enforce that repeated action links have DISTINCT ones. The registry cards are
          the live instance: many cards, same link text.

  - id: A4
    coverage:
      adna_site:
        status: gap
        sequenced: P4.4 (CI hardening)
        detail: >-
          `gate-33` parses `<time datetime="...">`, asserts the attribute is well-formed `YYYY-MM-DD`
          and that not every page carries the same day (the shallow-clone tell). It never compares the
          attribute to the element's VISIBLE TEXT, which is what this lock is about.

  - id: A5
    coverage:
      adna_site:
        status: enforced
        by: site/tests/gates/gate-38-layout-invariants.spec.ts
        anchor: "G38a anchor-offset: scroll-padding clears the sticky header"
        note: >-
          FIXED AND ENFORCED at P4.2 O2, 2026-08-24. Was the census's real find: `Header.astro:147`
          is `position: sticky` and `scroll-padding-top` appeared NOWHERE in `src/`, so every
          in-page anchor jump landed its target underneath the header — `gate-31` passed the whole
          time because it asserts anchors RESOLVE, a different and true claim. Fixed site-wide with
          `html { scroll-padding-top: calc(var(--header-height) + var(--space-4)) }` in global.css;
          `--header-height` is MEASURED (69px, identical at 375/768/1024/1280/1920 across four
          routes), not chosen. The gate re-measures the rendered header on every run rather than
          trusting that token, and asserts the header is still `sticky` so its own premise cannot
          evaporate silently. Red-proven: `scripts/craft_floor_redtest.sh`, 6 mutations + 1 control, 7/7.
          ⚠ Removing the two page-local `scroll-margin-top` rules on `commons.astro` was REQUIRED,
          not tidying — scroll-padding and scroll-margin COMPOSE, so leaving both would have
          over-scrolled those sections by ~165px instead of ~85px.

