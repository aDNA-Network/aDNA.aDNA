<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- empty_state — a reserved place with a name in it and nothing else.
       ADR-053 slot `empty_state`; spec: campaign_haussmann/artifacts/p4_1/slot_spec_empty_state.md §3.1.
       The dashed frame is a place that has been reserved. The solid rule is the one thing a planned
       vault genuinely has: a name. The void beneath is everything unwritten — which is what /vaults
       already says in prose ("named places with a governance skeleton and little else").
       currentColor is mandatory, not stylistic: it is what makes the both-theme contract structural
       (spec §3, §5) and keeps the mark out of gate-25 G25b's colour-literal scan. -->
  <rect x="3" y="4.25" width="18" height="15.5" rx="2" stroke-dasharray="2.6 2.1"/>
  <line x1="6.75" y1="9" x2="13.5" y2="9"/>
</svg>
